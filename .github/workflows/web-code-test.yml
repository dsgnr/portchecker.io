name: Web

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/web-code-test.yml

env:
  NODE_VERSION: "26"
  PKG_DIR: "frontend/web"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PKG_DIR }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier (check only)
        run: npm run prettier

  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PKG_DIR }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

  jest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PKG_DIR }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest with coverage
        run: |
          set -o pipefail
          npm test -- --coverage --coverageReporters=text-summary --coverageReporters=json-summary 2>&1 | tee jest.out
      - name: Surface coverage in job summary
        if: always()
        run: |
          {
            echo '## Web coverage'
            echo
            echo '```'
            sed -n '/=* Coverage summary =*/,/=*$/p' jest.out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
