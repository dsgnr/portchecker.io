version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[web] "
    # Only raise version-update PRs for major and minor bumps.
    # Security updates are unaffected by this ignore and will still be raised.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[api] "
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[docker] "
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
