---
version: "3.8"
services:
  web:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    container_name: web
    environment:
      - DEFAULT_PORT=443  # Populates a default port value to be populataed in the in the UI input
      - GOOGLE_ANALYTICS=  # optional
    ports:
      - 8080:8080
    volumes:
      - ./frontend/web:/web
  api:
    build:
      context: backend
      dockerfile: Dockerfile.dev
    container_name: api
    environment:
      - ALLOW_PRIVATE=false
    ports:
      - 8000:8000
    volumes:
      - ./backend/api:/src

