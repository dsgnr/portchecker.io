---
version: "3.8"
services:
  web:
    image: ghcr.io/dsgnr/portcheckerio-web:latest
    container_name: web
    environment:
      - DEFAULT_PORT=443  # Populates a default port value to be populataed in the in the UI input
      - GOOGLE_ANALYTICS=  # optional
    ports:
      - 8080:80
  api:
    image: ghcr.io/dsgnr/portcheckerio-api:latest
    container_name: api
    environment:
      - ALLOW_PRIVATE=false
    ports:
      - 8000:8000
