<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>portchecker.io</title>
        <link rel="icon" type="image/png" href="./portcheckerio-logo.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="./portcheckerio-logo.svg" />
        <link rel="shortcut icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="./portcheckerio-logo.png" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <link href="css/index.min.css" rel="stylesheet" />
        <script src="js/index.min.js"></script>
    </head>

    <body>
        <div class="app-container">
            <header class="header">
                <a href="/" class="logo">
                    <span class="logo-text">portchecker.io</span>
                </a>
                <nav class="nav">
                    <a href="/docs" class="nav-link">API Docs</a>
                    <a href="https://github.com/dsgnr/portchecker.io" target="_blank" rel="noopener noreferrer" class="nav-link github-link" aria-label="GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                    </a>
                </nav>
            </header>

            <main class="main">
                <section class="hero">
                    <h1 class="hero-title">Check Port Status</h1>
                    <p class="hero-subtitle">Free utility to check if ports are open on any hostname or IP address</p>
                </section>

                <section class="checker-card">
                    <form id="form" class="checker-form" novalidate>
                        <div class="form-group">
                            <label for="host" class="form-label">Host</label>
                            <input
                                type="text"
                                class="form-input"
                                id="host"
                                placeholder="example.com or IP address"
                                value="<%= htmlWebpackPlugin.options.DEFAULT_HOST %>"
                                autocomplete="off"
                                required
                            />
                            <span class="form-hint">Enter a hostname or IPv4 address</span>
                            <span class="form-error">Please enter a valid hostname or IP address</span>
                        </div>

                        <div class="form-group">
                            <label for="ports" class="form-label">Ports</label>
                            <div class="ports-input-wrapper">
                                <input
                                    type="text"
                                    class="form-input"
                                    id="ports"
                                    placeholder="80, 443, 22"
                                    value="<%= htmlWebpackPlugin.options.DEFAULT_PORT %>"
                                    autocomplete="off"
                                    required
                                />
                                <div class="quick-ports">
                                    <button type="button" class="quick-port-btn" data-port="80">HTTP</button>
                                    <button type="button" class="quick-port-btn" data-port="443">HTTPS</button>
                                    <button type="button" class="quick-port-btn" data-port="22">SSH</button>
                                    <button type="button" class="quick-port-btn" data-port="21">FTP</button>
                                    <button type="button" class="quick-port-btn" data-port="3306">MySQL</button>
                                    <button type="button" class="quick-port-btn" data-port="5432">PostgreSQL</button>
                                </div>
                            </div>
                            <span class="form-hint">Separate multiple ports with commas (1-65535)</span>
                            <span class="form-error">Please enter valid port numbers</span>
                        </div>

                        <button id="submit" type="submit" class="submit-btn">
                            <span class="submit-text">Check Ports</span>
                            <span class="submit-loading">
                                <svg class="spinner" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                                </svg>
                                Checking...
                            </span>
                        </button>
                    </form>

                    <div id="results" class="results hidden">
                        <div class="results-header">
                            <h3 class="results-title">Results</h3>
                            <span id="results-host" class="results-host"></span>
                        </div>
                        <div id="results-list" class="results-list"></div>
                    </div>

                    <div id="error" class="error-message hidden">
                        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span id="error-text"></span>
                    </div>
                </section>
            </main>

            <footer class="footer">
                <div class="footer-content">
                    <p class="copyright">
                        <script>document.write(new Date().getFullYear());</script>
                        © <a href="https://danielhand.io" target="_blank">Dan Hand (@dsgnr)</a>
                    </p>
                    <div class="footer-links">
                        <a href="https://www.digitalocean.com/?refcode=b54817e033c8&utm_campaign=Referral_Invite&utm_medium=Referral_Program&utm_source=badge" target="_blank" rel="noopener noreferrer">
                            <img height="28" src="https://web-platforms.sfo2.digitaloceanspaces.com/WWW/Badge%203.svg" alt="DigitalOcean Referral Badge" />
                        </a>
                        <a href="https://ko-fi.com/dsgnr" target="_blank" rel="noopener noreferrer">
                            <img height="28" src="https://storage.ko-fi.com/cdn/kofi3.png" alt="Buy Me a Coffee at ko-fi.com" />
                        </a>
                    </div>
                </div>
            </footer>
        </div>
    </body>
</html>
